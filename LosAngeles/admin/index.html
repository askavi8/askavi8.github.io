<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#121110">
  <title>ניהול · Los Angeles</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121110'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23f6ae52' text-anchor='middle'%3ELA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- ===== sign in / first-time setup ===== -->
  <section class="auth" id="auth" hidden>
    <div class="auth-card">
      <div class="auth-brand">
        <span class="logo" lang="en" dir="ltr">Los Angeles</span>
        <span class="auth-sub">ניהול החנות</span>
      </div>

      <form id="loginForm" class="stack" autocomplete="on" onsubmit="return false" hidden>
        <label class="field">
          <span class="field-label">סיסמת ניהול</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <label class="check">
          <input type="checkbox" name="remember" checked>
          <span>להישאר מחובר במכשיר הזה</span>
        </label>
        <button class="btn btn-primary btn-block" type="submit">כניסה</button>
        <p class="form-error" role="alert"></p>
        <button class="link-btn" type="button" data-action="show-setup">שכחתי סיסמה / החלפת טוקן</button>
      </form>

      <form id="setupForm" class="stack" autocomplete="off" onsubmit="return false" hidden>
        <div class="setup-intro">
          <h1>הגדרה ראשונית</h1>
          <p>פעם אחת בלבד. אחרי זה נכנסים רק עם סיסמת הניהול, מכל מכשיר.</p>
        </div>
        <label class="field">
          <span class="field-label">קוד הכניסה לאתר</span>
          <input name="code" inputmode="numeric" maxlength="6" dir="ltr" required>
          <span class="field-hint">אותו קוד של 6 ספרות שנכנסים איתו לחנות</span>
        </label>
        <label class="field">
          <span class="field-label">טוקן GitHub</span>
          <input name="token" dir="ltr" spellcheck="false" autocapitalize="off" placeholder="github_pat_…" required>
          <span class="field-hint">טוקן מסוג <bdi>Fine-grained</bdi> למאגר של האתר, עם הרשאת <bdi>Contents: Read and write</bdi></span>
        </label>
        <label class="field">
          <span class="field-label">סיסמת ניהול חדשה</span>
          <input type="password" name="password" autocomplete="new-password" minlength="8" required>
          <span class="field-hint">לפחות 8 תווים. זו הסיסמה שתשמש אותך ואת בעל החנות</span>
        </label>
        <label class="field">
          <span class="field-label">סיסמה שוב</span>
          <input type="password" name="password2" autocomplete="new-password" required>
        </label>
        <button class="btn btn-primary btn-block" type="submit">שמירה וכניסה</button>
        <p class="form-error" role="alert"></p>
        <button class="link-btn" type="button" data-action="show-login" hidden>חזרה לכניסה</button>
      </form>

      <p class="auth-status" id="authStatus" aria-live="polite"></p>
    </div>
  </section>

  <!-- ===== the panel ===== -->
  <div class="shell" id="shell" hidden>
    <aside class="sidebar">
      <div class="side-brand">
        <span class="logo" lang="en" dir="ltr">Los Angeles</span>
        <span class="side-sub">ניהול החנות</span>
      </div>
      <nav class="side-nav" aria-label="ניווט">
        <button type="button" data-view="products"><svg><use href="#i-box"/></svg>מוצרים</button>
        <button type="button" data-view="deals"><svg><use href="#i-tag"/></svg>מבצעים</button>
        <button type="button" data-view="categories"><svg><use href="#i-grid"/></svg>קטגוריות</button>
        <button type="button" data-view="looks"><svg><use href="#i-layers"/></svg>לוקים</button>
        <button type="button" data-view="settings"><svg><use href="#i-gear"/></svg>הגדרות</button>
      </nav>
      <div class="side-foot">
        <a class="side-link" href="../" target="_blank" rel="noopener"><svg><use href="#i-external"/></svg>צפייה באתר</a>
        <span class="sync" data-sync></span>
      </div>
    </aside>

    <header class="topbar">
      <span class="logo" lang="en" dir="ltr">Los Angeles</span>
      <span class="sync" data-sync></span>
      <a class="icon-btn" href="../" target="_blank" rel="noopener" aria-label="צפייה באתר"><svg><use href="#i-external"/></svg></a>
    </header>

    <main class="main" id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="ניווט">
      <button type="button" data-view="products"><svg><use href="#i-box"/></svg><span>מוצרים</span></button>
      <button type="button" data-view="deals"><svg><use href="#i-tag"/></svg><span>מבצעים</span></button>
      <button type="button" data-view="categories"><svg><use href="#i-grid"/></svg><span>קטגוריות</span></button>
      <button type="button" data-view="looks"><svg><use href="#i-layers"/></svg><span>לוקים</span></button>
      <button type="button" data-view="settings"><svg><use href="#i-gear"/></svg><span>הגדרות</span></button>
    </nav>
  </div>

  <!-- editor window: product / deal / category / look -->
  <dialog class="editor" id="editor" aria-labelledby="editorTitle">
    <form class="editor-form" id="editorForm" novalidate onsubmit="return false">
      <header class="editor-head">
        <button class="icon-btn" type="button" data-action="close-editor" aria-label="סגירה"><svg><use href="#i-close"/></svg></button>
        <h2 id="editorTitle"></h2>
        <span class="editor-extra" id="editorExtra"></span>
      </header>
      <div class="editor-body" id="editorBody"></div>
      <footer class="editor-foot">
        <button class="btn btn-danger-ghost" type="button" data-action="delete" id="editorDelete" hidden>מחיקה</button>
        <span class="editor-error" id="editorError" role="alert"></span>
        <button class="btn btn-primary" type="submit" id="editorSave">שמירה</button>
      </footer>
    </form>
  </dialog>

  <!-- pick a product colour (for looks) -->
  <dialog class="editor picker" id="picker" aria-labelledby="pickerTitle">
    <div class="editor-form">
      <header class="editor-head">
        <button class="icon-btn" type="button" data-action="close-picker" aria-label="סגירה"><svg><use href="#i-close"/></svg></button>
        <h2 id="pickerTitle">בחירת פריט</h2>
        <span></span>
      </header>
      <div class="picker-tools">
        <input type="search" id="pickerSearch" placeholder="חיפוש לפי שם או צבע" aria-label="חיפוש">
        <div class="chips" id="pickerChips"></div>
      </div>
      <div class="editor-body"><div class="pick-grid" id="pickerGrid"></div></div>
    </div>
  </dialog>

  <dialog class="confirm" id="confirm">
    <form method="dialog">
      <p id="confirmText"></p>
      <div class="confirm-actions">
        <button class="btn btn-ghost" value="cancel">ביטול</button>
        <button class="btn btn-primary" value="ok" id="confirmOk">אישור</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="progress" id="progress" hidden></div>

  <!-- icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-box" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5zM3.5 7.5 12 12l8.5-4.5M12 12v9"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3 12.2V4a1 1 0 0 1 1-1h8.2a1 1 0 0 1 .7.3l8 8a1 1 0 0 1 0 1.4l-8.2 8.2a1 1 0 0 1-1.4 0l-8-8a1 1 0 0 1-.3-.7z"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></g></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3 2.5 8 12 13l9.5-5zM2.5 12.5 12 17.5l9.5-5M2.5 16.5 12 21.5l9.5-5"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></g></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-drag" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></g></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 6-6 6 6 6"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></g></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6M5 7l1 12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m6 15 6-6 6 6"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></g></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c5 0 9 4.5 10 7-.4 1-1.2 2.3-2.4 3.5M6.6 6.6C4.6 7.9 3.1 9.8 2 12c1 2.5 5 7 10 7 1.9 0 3.6-.6 5-1.5M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l-5-5 5-5M5 12h11"/></symbol>
    </defs>
  </svg>

  <script src="admin.js"></script>
</body>
</html>
