<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <title>Los Angeles | כניסה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- loaded without blocking the script below, so the entry screen works before the fonts arrive -->
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: radial-gradient(ellipse at 50% 0%, #1f1a12, #0a0a0a 60%);
      color: #f4f1ea;
      font-family: "Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    .gate { width: min(360px, 100%); text-align: center; }
    .brand {
      margin: 0;
      font-family: "UnifrakturMaguntia", serif;
      font-weight: 400;
      font-size: clamp(3rem, 15vw, 4.2rem);
      line-height: 1.1;
      color: #f6ae52;
      text-shadow: 0 3px 0 #2f3a46;
    }
    .sub { margin: 4px 0 32px; font-size: 0.7rem; letter-spacing: 0.35em; color: #9b968d; direction: ltr; }
    label { display: block; margin-bottom: 12px; font-weight: 500; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      background: #141414;
      color: #f4f1ea;
      font: 700 1.8rem/1 "Heebo", system-ui, sans-serif;
      letter-spacing: 0.5em;
      text-align: center;
      direction: ltr;
    }
    input:focus { outline: 2px solid #f6ae52; outline-offset: -1px; }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: 0;
      border-radius: 999px;
      background: #f6ae52;
      color: #111;
      font: 700 1rem "Heebo", system-ui, sans-serif;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { min-height: 1.6em; margin: 12px 0 0; color: #e5484d; font-size: 0.95rem; }
    .status { min-height: 1.4em; margin: 6px 0 0; color: #9b968d; font-size: 0.85rem; }
    .shake { animation: shake 0.35s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  </style>
</head>
<body>
  <!-- onsubmit guard: never let the browser submit (and reload) the form, even before the script below runs -->
  <form class="gate" id="gate" autocomplete="off" onsubmit="return false">
    <h1 class="brand" lang="en" dir="ltr">Los Angeles</h1>
    <p class="sub">FASHION FOR MEN</p>
    <label for="code">הכניסה לאתר בקוד</label>
    <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-describedby="error" autofocus>
    <button id="enter" type="submit">כניסה</button>
    <p class="error" id="error" role="alert"></p>
    <p class="status" id="status" aria-live="polite"></p>
  </form>

  <script>
    (() => {
      "use strict";
      const PAYLOAD_URL = "site.bin?v=892fbb36dd";
      const ITERATIONS = 150000;
      const CODE_KEY = "la_entry_code";
      const form = document.getElementById("gate");
      const input = document.getElementById("code");
      const button = document.getElementById("enter");
      const error = document.getElementById("error");
      const status = document.getElementById("status");

      if (!window.crypto || !crypto.subtle) {
        error.textContent = "הדפדפן הזה לא נתמך. פתחו את הקישור ב-Chrome או ב-Safari.";
        button.disabled = true;
        return;
      }

      // download the encrypted site right away, while the code is being typed.
      // Shows progress, restarts a download that stalls, and retries once.
      const PAYLOAD_SIZE = 332068;
      const STALL_MS = 12000;
      let payload = null;
      let loaded = false;
      let percent = 0;

      async function download(url) {
        const ctrl = new AbortController();
        let timer = setTimeout(() => ctrl.abort(), STALL_MS);
        const r = await fetch(url, { signal: ctrl.signal });
        if (!r.ok) throw new Error("HTTP " + r.status);
        if (!r.body || !r.body.getReader) {
          clearTimeout(timer);
          return r.arrayBuffer();
        }
        const out = new Uint8Array(PAYLOAD_SIZE);
        const reader = r.body.getReader();
        let got = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          clearTimeout(timer);
          timer = setTimeout(() => ctrl.abort(), STALL_MS);
          if (got + value.length > out.length) throw new Error("unexpected size");
          out.set(value, got);
          got += value.length;
          percent = Math.floor((got / PAYLOAD_SIZE) * 100);
          if (button.disabled && !loaded) status.textContent = "טוען את האתר… " + percent + "%";
        }
        clearTimeout(timer);
        if (got !== PAYLOAD_SIZE) throw new Error("incomplete download");
        return out.buffer;
      }

      function loadPayload() {
        if (!payload) {
          payload = download(PAYLOAD_URL)
            .catch(() => download(PAYLOAD_URL + "&retry=" + Date.now()))
            .then((buf) => {
              loaded = true;
              return buf;
            })
            .catch((e) => {
              payload = null;
              throw e;
            });
        }
        return payload;
      }
      loadPayload().catch(() => {});

      // the store data (products, deals, …) is a separate small file that the admin panel
      // rewrites; it is always fetched fresh so changes show up as soon as they are published
      let data = null;
      function loadData() {
        const get = (n) =>
          fetch("data.bin?t=" + Date.now() + "-" + n, { cache: "no-store" }).then((r) => {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.arrayBuffer();
          });
        if (!data) data = get(0).catch(() => get(1)).catch((e) => ((data = null), Promise.reject(e)));
        return data;
      }
      loadData().catch(() => {});

      async function deriveKey(code, salt) {
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: ITERATIONS, hash: "SHA-256" },
          base,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
      }

      // [16-byte salt][12-byte IV][ciphertext]; AES-GCM refuses a wrong key, so a wrong code throws
      const unseal = (key, buf) => crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(buf, 16, 12) }, key, new Uint8Array(buf, 28));

      async function decrypt(code, buf) {
        const key = await deriveKey(code, new Uint8Array(buf, 0, 16));
        const plain = await unseal(key, buf);
        // [uint32 LE header length][header JSON][bytes of the first-paint images]
        const headerLength = new DataView(plain).getUint32(0, true);
        const header = JSON.parse(new TextDecoder().decode(new Uint8Array(plain, 4, headerLength)));
        return { ...header, key, body: new Uint8Array(plain, 4 + headerLength) };
      }

      // Product images start as a 1x1 placeholder that carries the encrypted file's path
      // after "#", and are fetched + decrypted only when they come near the screen.
      const PLACEHOLDER = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
      const IMAGE_TYPES = { webp: "image/webp", jpg: "image/jpeg", png: "image/png" };

      function lazyRefs(store) {
        const lazy = {};
        const swap = (ref) => {
          const m = /^i\/[0-9a-f]+\.(webp|jpg|png)\.bin$/.exec(ref || "");
          if (!m) return ref;
          lazy[ref] = { type: IMAGE_TYPES[m[1]], file: ref };
          return PLACEHOLDER + "#" + ref;
        };
        for (const c of store.categories || []) c.image = swap(c.image);
        for (const p of store.products || []) for (const c of p.colors || []) c.image = swap(c.image);
        return lazy;
      }

      function lazyImages(lazy, key) {
        const cache = {};
        const load = (path) =>
          (cache[path] ||= fetch(lazy[path].file)
            .then((r) => {
              if (!r.ok) throw new Error("HTTP " + r.status);
              return r.arrayBuffer();
            })
            .then((buf) => crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(buf, 0, 12) }, key, new Uint8Array(buf, 12)))
            .then((plain) => URL.createObjectURL(new Blob([plain], { type: lazy[path].type })))
            .catch((e) => {
              delete cache[path];
              throw e;
            }));
        const pathOf = (img) => {
          const src = img.getAttribute("src") || "";
          return src.startsWith(PLACEHOLDER + "#") ? src.slice(PLACEHOLDER.length + 1) : null;
        };
        const reveal = (img) => {
          io.unobserve(img);
          const path = pathOf(img);
          if (!path || !lazy[path]) return;
          load(path).then(
            (url) => {
              if (pathOf(img) === path) img.src = url;
            },
            () => io.observe(img)
          );
        };
        const io = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              if (!entry.isIntersecting) continue;
              reveal(entry.target);
              // in a sideways-scrolling row, also fetch the next few cards so a swipe shows them right away
              let next = entry.target.closest(".row-scroll > *")?.nextElementSibling;
              for (let k = 0; next && k < 4; k++, next = next.nextElementSibling) {
                const img = next.querySelector("img");
                if (img && pathOf(img)) reveal(img);
              }
            }
          },
          { rootMargin: "600px 0px" }
        );
        const scan = (node) => {
          if (node.nodeType !== 1) return;
          if (node.tagName === "IMG" && pathOf(node)) io.observe(node);
          node.querySelectorAll('img[src^="data:image/gif"]').forEach((img) => pathOf(img) && io.observe(img));
        };
        scan(document.body);
        new MutationObserver((records) => {
          for (const r of records) {
            if (r.type === "attributes") scan(r.target);
            else r.addedNodes.forEach(scan);
          }
        }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["src"] });
      }

      function render({ html, assets, key, body }, store) {
        const urls = {};
        for (const [path, a] of Object.entries(assets)) {
          urls[path] = URL.createObjectURL(new Blob([body.subarray(a.offset, a.offset + a.length)], { type: a.type }));
        }
        html = html.replace(/images\/[\w.-]+\.(?:webp|png|jpg)/g, (m) => urls[m] || m);
        const lazy = lazyRefs(store);
        window.__LA_DATA = store;
        const doc = new DOMParser().parseFromString(html, "text/html");
        document.documentElement.lang = doc.documentElement.lang;
        document.documentElement.dir = doc.documentElement.dir;
        document.head.replaceChildren(...doc.head.childNodes);
        document.body.replaceChildren(...doc.body.childNodes);
        lazyImages(lazy, key);
        // scripts from DOMParser don't run when inserted, so recreate them in order
        for (const old of document.querySelectorAll("script")) {
          const s = document.createElement("script");
          s.textContent = old.textContent;
          old.replaceWith(s);
        }
        const target = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (target) target.scrollIntoView();
      }

      function busy(on, text) {
        button.disabled = on;
        button.textContent = on ? "פותח…" : "כניסה";
        status.textContent = text || "";
      }

      function fail(message, shake) {
        busy(false);
        error.textContent = message;
        if (shake) {
          input.value = "";
          form.classList.remove("shake");
          void form.offsetWidth;
          form.classList.add("shake");
        }
        input.focus();
      }

      // the whole flow: download (if still needed) → decrypt → show the site
      async function enter(code, fromSaved) {
        busy(true, loaded ? "" : "טוען את האתר… " + percent + "%");
        error.textContent = "";
        let buf, dataBuf;
        try {
          [buf, dataBuf] = await Promise.all([loadPayload(), loadData()]);
        } catch {
          return fail("לא הצלחנו לטעון את האתר. לחצו שוב על כניסה כדי לנסות שוב. אם זה חוזר, נסו לפתוח ב-Chrome.");
        }
        let site;
        try {
          site = await decrypt(code, buf);
        } catch {
          if (fromSaved) {
            try { localStorage.removeItem(CODE_KEY); } catch { /* ignore */ }
            return busy(false);
          }
          return fail("קוד שגוי", true);
        }
        try { localStorage.setItem(CODE_KEY, code); } catch { /* not remembered on this device */ }
        try {
          const store = JSON.parse(new TextDecoder().decode(await unseal(site.key, dataBuf)));
          render(site, store);
        } catch (e) {
          data = null;
          fail("שגיאה בפתיחת האתר: " + (e && e.message ? e.message : e));
        }
      }

      // accept digits from any keyboard (e.g. Arabic-Indic digits) and ignore everything else
      const normalize = (v) =>
        v
          .replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 0x0660))
          .replace(/[۰-۹]/g, (d) => String(d.charCodeAt(0) - 0x06f0))
          .replace(/\D/g, "")
          .slice(0, 6);

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (button.disabled) return;
        const code = normalize(input.value);
        if (code.length !== 6) {
          error.textContent = "יש להזין 6 ספרות";
          return;
        }
        enter(code, false);
      });

      input.addEventListener("input", () => {
        input.value = normalize(input.value);
        if (input.value.length === 6 && !button.disabled) button.click();
      });

      // a device that already entered the code goes straight in
      let saved = null;
      try { saved = localStorage.getItem(CODE_KEY); } catch { /* storage unavailable */ }
      if (saved && /^\d{6}$/.test(saved)) {
        enter(saved, true);
      } else if (normalize(input.value).length === 6) {
        // the code was typed before this script was ready
        button.click();
      }
    })();
  </script>
</body>
</html>
