<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0a0a">
  <title>Los Angeles | כניסה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- loaded without blocking the script below, so the entry screen works before the fonts arrive -->
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: radial-gradient(ellipse at 50% 0%, #1f1a12, #0a0a0a 60%);
      color: #f4f1ea;
      font-family: "Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    .gate { width: min(360px, 100%); text-align: center; }
    .brand {
      margin: 0;
      font-family: "UnifrakturMaguntia", serif;
      font-weight: 400;
      font-size: clamp(3rem, 15vw, 4.2rem);
      line-height: 1.1;
      color: #f6ae52;
      text-shadow: 0 3px 0 #2f3a46;
    }
    .sub { margin: 4px 0 32px; font-size: 0.7rem; letter-spacing: 0.35em; color: #9b968d; direction: ltr; }
    label { display: block; margin-bottom: 12px; font-weight: 500; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      background: #141414;
      color: #f4f1ea;
      font: 700 1.8rem/1 "Heebo", system-ui, sans-serif;
      letter-spacing: 0.5em;
      text-align: center;
      direction: ltr;
    }
    input:focus { outline: 2px solid #f6ae52; outline-offset: -1px; }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: 0;
      border-radius: 999px;
      background: #f6ae52;
      color: #111;
      font: 700 1rem "Heebo", system-ui, sans-serif;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { min-height: 1.6em; margin: 12px 0 0; color: #e5484d; font-size: 0.95rem; }
    .status { min-height: 1.4em; margin: 6px 0 0; color: #9b968d; font-size: 0.85rem; }
    .shake { animation: shake 0.35s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  </style>
</head>
<body>
  <!-- onsubmit guard: never let the browser submit (and reload) the form, even before the script below runs -->
  <form class="gate" id="gate" autocomplete="off" onsubmit="return false">
    <h1 class="brand" lang="en" dir="ltr">Los Angeles</h1>
    <p class="sub">FASHION FOR MEN</p>
    <label for="code">הכניסה לאתר בקוד</label>
    <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-describedby="error" autofocus>
    <button id="enter" type="submit">כניסה</button>
    <p class="error" id="error" role="alert"></p>
    <p class="status" id="status" aria-live="polite"></p>
  </form>

  <script>
    (() => {
      "use strict";
      const PAYLOAD_URL = "site.bin?v=8cd507cd26";
      const ITERATIONS = 600000;
      const CODE_KEY = "la_entry_code";
      const form = document.getElementById("gate");
      const input = document.getElementById("code");
      const button = document.getElementById("enter");
      const error = document.getElementById("error");
      const status = document.getElementById("status");

      if (!window.crypto || !crypto.subtle) {
        error.textContent = "הדפדפן הזה לא נתמך. פתחו את הקישור ב-Chrome או ב-Safari.";
        button.disabled = true;
        return;
      }

      // download the encrypted site right away, while the code is being typed.
      // Shows progress, restarts a download that stalls, and retries once.
      const PAYLOAD_SIZE = 2878755;
      const STALL_MS = 12000;
      let payload = null;
      let loaded = false;
      let percent = 0;

      async function download(url) {
        const ctrl = new AbortController();
        let timer = setTimeout(() => ctrl.abort(), STALL_MS);
        const r = await fetch(url, { signal: ctrl.signal });
        if (!r.ok) throw new Error("HTTP " + r.status);
        if (!r.body || !r.body.getReader) {
          clearTimeout(timer);
          return r.arrayBuffer();
        }
        const out = new Uint8Array(PAYLOAD_SIZE);
        const reader = r.body.getReader();
        let got = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          clearTimeout(timer);
          timer = setTimeout(() => ctrl.abort(), STALL_MS);
          if (got + value.length > out.length) throw new Error("unexpected size");
          out.set(value, got);
          got += value.length;
          percent = Math.floor((got / PAYLOAD_SIZE) * 100);
          if (button.disabled && !loaded) status.textContent = "טוען את האתר… " + percent + "%";
        }
        clearTimeout(timer);
        if (got !== PAYLOAD_SIZE) throw new Error("incomplete download");
        return out.buffer;
      }

      function loadPayload() {
        if (!payload) {
          payload = download(PAYLOAD_URL)
            .catch(() => download(PAYLOAD_URL + "&retry=" + Date.now()))
            .then((buf) => {
              loaded = true;
              return buf;
            })
            .catch((e) => {
              payload = null;
              throw e;
            });
        }
        return payload;
      }
      loadPayload().catch(() => {});

      const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

      async function decrypt(code, buf) {
        const salt = new Uint8Array(buf, 0, 16);
        const iv = new Uint8Array(buf, 16, 12);
        const data = new Uint8Array(buf, 28);
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: ITERATIONS, hash: "SHA-256" },
          base,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        // AES-GCM refuses to decrypt with a wrong key, so a wrong code throws here
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
        return JSON.parse(new TextDecoder().decode(plain));
      }

      function render({ html, assets }) {
        const urls = {};
        for (const [path, a] of Object.entries(assets)) {
          urls[path] = URL.createObjectURL(new Blob([bytes(a.data)], { type: a.type }));
        }
        html = html.replace(/images\/[\w.-]+\.(?:jpg|png)/g, (m) => urls[m] || m);
        const doc = new DOMParser().parseFromString(html, "text/html");
        document.documentElement.lang = doc.documentElement.lang;
        document.documentElement.dir = doc.documentElement.dir;
        document.head.replaceChildren(...doc.head.childNodes);
        document.body.replaceChildren(...doc.body.childNodes);
        // scripts from DOMParser don't run when inserted, so recreate them in order
        for (const old of document.querySelectorAll("script")) {
          const s = document.createElement("script");
          s.textContent = old.textContent;
          old.replaceWith(s);
        }
        const target = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (target) target.scrollIntoView();
      }

      function busy(on, text) {
        button.disabled = on;
        button.textContent = on ? "פותח…" : "כניסה";
        status.textContent = text || "";
      }

      function fail(message, shake) {
        busy(false);
        error.textContent = message;
        if (shake) {
          input.value = "";
          form.classList.remove("shake");
          void form.offsetWidth;
          form.classList.add("shake");
        }
        input.focus();
      }

      // the whole flow: download (if still needed) → decrypt → show the site
      async function enter(code, fromSaved) {
        busy(true, loaded ? "" : "טוען את האתר… " + percent + "%");
        error.textContent = "";
        let buf;
        try {
          buf = await loadPayload();
        } catch {
          return fail("לא הצלחנו לטעון את האתר. לחצו שוב על כניסה כדי לנסות שוב. אם זה חוזר, נסו לפתוח ב-Chrome.");
        }
        let site;
        try {
          site = await decrypt(code, buf);
        } catch {
          if (fromSaved) {
            try { localStorage.removeItem(CODE_KEY); } catch { /* ignore */ }
            return busy(false);
          }
          return fail("קוד שגוי", true);
        }
        try { localStorage.setItem(CODE_KEY, code); } catch { /* not remembered on this device */ }
        try {
          render(site);
        } catch (e) {
          fail("שגיאה בפתיחת האתר: " + (e && e.message ? e.message : e));
        }
      }

      // accept digits from any keyboard (e.g. Arabic-Indic digits) and ignore everything else
      const normalize = (v) =>
        v
          .replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 0x0660))
          .replace(/[۰-۹]/g, (d) => String(d.charCodeAt(0) - 0x06f0))
          .replace(/\D/g, "")
          .slice(0, 6);

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (button.disabled) return;
        const code = normalize(input.value);
        if (code.length !== 6) {
          error.textContent = "יש להזין 6 ספרות";
          return;
        }
        enter(code, false);
      });

      input.addEventListener("input", () => {
        input.value = normalize(input.value);
        if (input.value.length === 6 && !button.disabled) button.click();
      });

      // a device that already entered the code goes straight in
      let saved = null;
      try { saved = localStorage.getItem(CODE_KEY); } catch { /* storage unavailable */ }
      if (saved && /^\d{6}$/.test(saved)) {
        enter(saved, true);
      } else if (normalize(input.value).length === 6) {
        // the code was typed before this script was ready
        button.click();
      }
    })();
  </script>
</body>
</html>
